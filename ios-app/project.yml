name: JableTVMobile
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.0.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.w.jabletvmobile
    PRODUCT_NAME: "jable"
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: 1.0.6
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: JableTVMobile/Info.plist
targets:
  JableTVMobile:
    type: application
    platform: iOS
    sources:
      - path: JableTVMobile
    dependencies:
      - package: Kingfisher
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
