name: jable-media-library

services:
  app:
    platform: linux/amd64
    image: jable-media-library:20260909-signin-verified-amd64
    container_name: jable-media-library
    restart: unless-stopped
    shm_size: "1gb"
    dns:
      - 223.5.5.5
      - 119.29.29.29
    ports:
      - "8788:8788"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      MEDIA_DIR: /media
      HUANGGUO_SITE: https://thu.fdxqupvz.cc
      LICENSE_REVOCATION_URL: http://v6.814000.xyz:8789/revocation.json
      HTTP_PROXY: ""
      SCRAPER_SOURCES: www.javbus.com,www.busdmm.ink,www.dmmsee.bond
    volumes:
      - /volume2/docker/jable-media-library/data:/data
      - /volume1/观影/new/jable/img-cache:/tmp/img-cache
      - /volume1/观影/new/jable/strm:/strm
      - /volume1/观影/new/jable/video:/media
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
