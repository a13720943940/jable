name: jable-media-library

services:
  app:
    image: jable-media-library:amd64
    platform: linux/amd64
    container_name: jable-media-library
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "8788:8788"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      MEDIA_DIR: /media
      HUANGGUO_SITE: ${HUANGGUO_SITE:-https://thu.fdxqupvz.cc}
      LICENSE_REVOCATION_URL: ${LICENSE_REVOCATION_URL:?请设置公网可访问的吊销名单地址，例如 http://v6.814000.xyz:8789/revocation.json}
      HTTP_PROXY: ${HTTP_PROXY:-}
      JABLE_COOKIE: ${JABLE_COOKIE:-}
      SCRAPER_SOURCES: ${SCRAPER_SOURCES:-www.javbus.com,www.busdmm.ink,www.dmmsee.bond}
      CLOUD115_MODE: ${CLOUD115_MODE:-bridge}
      CLOUD115_ENDPOINT: ${CLOUD115_ENDPOINT:-}
      CLOUD115_TOKEN: ${CLOUD115_TOKEN:-}
      CLOUD115_COOKIE: ${CLOUD115_COOKIE:-}
    volumes:
      - /volume2/docker/jable-media-library/data:/data
      - /volume1/观影/new/old9kg:/media
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
