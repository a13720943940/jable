<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>jable.tv 下载工具</title>
  <style>
    :root{--ink:#18221d;--muted:#6b776f;--paper:#f8faf6;--line:#dce5dd;--green:#178553;--blue:#1677ed;--red:#ca4343;--orange:#bb751b;--shadow:0 18px 55px rgba(34,57,43,.10)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Sans SC","PingFang SC",sans-serif;background:radial-gradient(circle at 8% 0,#fff5ce 0,transparent 28%),radial-gradient(circle at 95% 12%,#d9eef2 0,transparent 32%),#edf2ec;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}
    main{width:min(1240px,calc(100% - 28px));margin:22px auto 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.top h1{font-size:27px;letter-spacing:-.5px;margin:0}.health{padding:7px 12px;border-radius:99px;background:#e1f1e7;color:var(--green);font-weight:800;font-size:13px}
    .panel{background:rgba(249,251,247,.9);border:1px solid rgba(255,255,255,.85);border-radius:19px;padding:15px;box-shadow:var(--shadow)}.capture{display:grid;grid-template-columns:1fr 120px 138px;gap:8px}.capture-note{height:20px;color:var(--muted);font-size:12px;margin:5px 3px 3px}.task-form{display:grid;grid-template-columns:2fr 1.25fr .8fr .9fr;gap:8px}.field-wide{grid-column:span 2}.field,.capture input{height:41px;border:1px solid var(--line);border-radius:10px;background:white;padding:0 11px;min-width:0}.button{height:41px;border:1px solid var(--line);border-radius:10px;background:#e7ece8;color:var(--ink);font-weight:750;padding:0 14px}.button.primary{background:var(--blue);border-color:var(--blue);color:white}.button.danger{color:var(--red)}.helper{display:flex;align-items:center;justify-content:center;text-decoration:none}
    .options{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 2px 4px;color:var(--muted);font-size:13px}.toggle{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:650}.toggle input{accent-color:var(--blue);width:17px;height:17px}.threads{display:inline-flex;align-items:center;gap:6px}.threads input{width:58px;height:31px;border:1px solid var(--line);border-radius:8px;padding:0 7px}.spacer{flex:1}.settings-button{border:0;background:transparent;color:var(--blue);font-weight:750;padding:5px}
    .settings{display:none;grid-template-columns:1fr 1fr;gap:9px;padding:11px;margin-top:7px;border-radius:12px;background:#edf2ee}.settings.open{display:grid}.settings-row{display:grid;grid-template-columns:95px 1fr;align-items:center;gap:8px;font-size:13px}.settings-row input{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 9px}.settings-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
    .toolbar{display:flex;align-items:center;gap:8px;margin:15px 2px 9px;flex-wrap:wrap}.stats{display:flex;gap:13px;color:var(--muted);font-size:13px}.stats strong{color:var(--ink)}.filters{margin-left:auto;display:flex;gap:5px}.filter{height:30px;border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:99px;padding:0 11px;color:var(--muted)}.filter.active{background:var(--ink);border-color:var(--ink);color:white}
    .tasks{display:grid;gap:9px}.empty{text-align:center;padding:54px;color:var(--muted)}.task{display:grid;grid-template-columns:58px 1fr;background:white;border:1px solid var(--line);border-radius:14px;padding:11px;gap:11px}.cover{width:58px;height:81px;border-radius:8px;object-fit:cover;background:linear-gradient(145deg,#e8eee9,#d9e1dc)}.cover-placeholder{display:flex;align-items:center;justify-content:center;color:#89948d;font-size:11px}.task-main{min-width:0}.task-head{display:flex;align-items:center;gap:8px}.state{padding:4px 8px;border-radius:99px;background:#e7f4eb;color:var(--green);font-size:11px;font-weight:850;white-space:nowrap}.state.failed{background:#fdeaea;color:var(--red)}.state.running{background:#e7f0ff;color:var(--blue)}.task-title{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.percent{margin-left:auto;color:var(--muted);font-size:13px}progress{width:100%;height:8px;margin:8px 0 5px;accent-color:var(--blue)}
    .steps,.meta,.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.step{padding:3px 7px;border-radius:99px;background:#f0f2f0;color:var(--muted);font-size:11px;font-weight:750}.step.succeeded{background:#e4f4e9;color:var(--green)}.step.failed{background:#fdeaea;color:var(--red)}.step.running{background:#e6efff;color:var(--blue)}.meta{margin-top:7px;color:var(--muted);font-size:12px}.actions{margin-top:8px}.mini{height:28px;border:0;border-radius:7px;background:#eef1ef;padding:0 9px;font-size:12px;color:var(--ink)}.mini.danger{color:var(--red)}.result{color:var(--muted);font-size:12px;margin-top:6px}.log{display:none;grid-column:1/-1;white-space:pre-wrap;background:#101411;color:#55df7d;border-radius:9px;padding:10px;max-height:220px;overflow:auto;font:12px ui-monospace,monospace;margin:0}.task.open .log{display:block}
    dialog{border:0;border-radius:18px;padding:0;box-shadow:0 30px 100px rgba(0,0,0,.28);width:min(760px,calc(100% - 28px));color:var(--ink)}dialog::backdrop{background:rgba(16,25,20,.45);backdrop-filter:blur(3px)}.modal{padding:19px}.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.modal-head h2{font-size:21px;margin:0}.modal-head button{margin-left:auto}.source-list{display:grid;gap:7px}.source-row{display:grid;grid-template-columns:30px 1fr 82px 32px 32px 32px;gap:6px;align-items:center}.source-row input[type=text]{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px}.health-tag{font-size:12px;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.history-search{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-bottom:9px}.history-list{height:310px;overflow:auto;border:1px solid var(--line);border-radius:10px}.history-item{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid #edf0ed;background:white;padding:9px}.history-item.selected{background:#e8f1ff}.catalog-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:610px;overflow:auto;padding:2px}.catalog-card{border:1px solid var(--line);border-radius:12px;background:#f8faf8;overflow:hidden}.catalog-card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#e5eae6}.catalog-info{padding:9px}.catalog-title{display:block;color:var(--ink);font-weight:750;font-size:13px;line-height:1.45;text-decoration:none;height:38px;overflow:hidden}.catalog-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:6px 0}.catalog-card button{width:100%}.catalog-status{text-align:center;padding:55px;color:var(--muted)}.preview-grid{display:grid;grid-template-columns:210px 1fr;gap:17px}.preview-cover{width:210px;height:295px;object-fit:cover;background:#e8ece9;border-radius:10px}.preview-data{display:grid;gap:9px}.preview-data label{font-size:12px;color:var(--muted)}.preview-data div{font-size:14px;color:var(--ink);margin-top:3px}.description{max-height:130px;overflow:auto;white-space:pre-wrap}
    @media(max-width:850px){main{width:min(100% - 16px,1240px);margin-top:12px}.capture{grid-template-columns:1fr 1fr}.capture input{grid-column:1/-1}.task-form{grid-template-columns:1fr 1fr}.field-wide{grid-column:1/-1}.settings{grid-template-columns:1fr}.toolbar{align-items:flex-start}.filters{margin-left:0;width:100%;overflow:auto}.stats{flex-wrap:wrap}.catalog-grid{grid-template-columns:repeat(2,1fr)}.preview-grid{grid-template-columns:1fr}.preview-cover{width:150px;height:210px}.task{grid-template-columns:48px 1fr}.cover{width:48px;height:68px}.source-row{grid-template-columns:25px 1fr 65px 30px 30px 30px}}
  </style>
</head>
<body><main>
  <header class="top"><h1>jable.tv 下载工具</h1><span id="health" class="health">正在连接</span></header>
  <section class="panel">
    <div class="capture"><input id="pageUrl" placeholder="Jable 影片详情地址，打开页面后也可由浏览器助手自动填充"><button id="extractButton" class="button" type="button">获取影片信息</button><a class="button helper" href="/jable-helper.user.js">安装浏览器助手</a></div>
    <div id="syncNote" class="capture-note">浏览器助手可自动同步标题、番号和页面捕获到的 M3U8。</div>
    <form id="form" class="task-form">
      <input class="field field-wide" id="url" placeholder="M3U8 / MPD / MP4 下载地址" required>
      <input class="field" id="title" placeholder="影片标题（自动或手动）"><input class="field" id="catalog" placeholder="番号（例如 SAME-246）">
      <input class="field" id="performer" placeholder="演员（刮削自动获取）"><input class="field field-wide" id="extraArgs" placeholder="下载核心额外参数（可选）">
      <button class="button primary" type="submit">加入队列</button>
    </form>
    <div class="options">
      <span class="threads">下载线程 <input id="threads" type="number" min="1" max="32" value="2"></span>
      <label class="toggle"><input id="organizeEnabled" type="checkbox" checked>下载后刮削整理</label>
      <label class="toggle"><input id="allowDuplicate" type="checkbox">允许重复下载</label>
      <button class="settings-button" type="button" onclick="openCatalog()">自动影片库</button>
      <button class="settings-button" type="button" onclick="openHistory()">刮削历史文件</button>
      <button class="settings-button" type="button" onclick="openSources()">刮削源管理</button>
      <span class="spacer"></span><button class="settings-button" type="button" onclick="settingsPanel.classList.toggle('open')">下载与失败路径设置</button>
    </div>
    <div id="settingsPanel" class="settings">
      <label class="settings-row"><span>代理地址</span><input id="proxy" placeholder="留空直连，例如 http://192.168.2.50:7890"></label>
      <label class="settings-row"><span>刮削失败</span><span class="toggle"><input id="failureEnabled" type="checkbox">发送到单独目录</span></label>
      <label class="settings-row"><span>失败路径</span><input id="failurePath" value="/media/待整理"></label>
      <div class="settings-actions"><button class="button" type="button" onclick="saveSettings()">保存设置</button></div>
    </div>
  </section>

  <div class="toolbar"><div id="stats" class="stats"></div><div id="filters" class="filters"></div></div>
  <div id="tasks" class="tasks"><div class="empty">暂无任务</div></div>
</main>

<dialog id="sourceDialog"><div class="modal"><div class="modal-head"><h2>刮削源管理</h2><span class="health-tag">按从上到下顺序尝试</span><button class="mini" onclick="sourceDialog.close()">关闭</button></div><div id="sourceList" class="source-list"></div><div class="modal-actions"><button class="button" onclick="addSource()">添加来源</button><button class="button" onclick="checkAllSources()">检测全部</button><button class="button primary" onclick="saveSources()">保存</button></div></div></dialog>
<dialog id="catalogDialog"><div class="modal"><div class="modal-head"><h2>Jable 最新影片</h2><span id="catalogNote" class="health-tag">点击后自动获取 M3U8 并加入队列</span><button class="mini" onclick="loadCatalog(true)">刷新</button><button class="mini" onclick="catalogDialog.close()">关闭</button></div><div id="catalogGrid" class="catalog-grid"><div class="catalog-status">正在加载影片列表…</div></div></div></dialog>
<dialog id="historyDialog"><div class="modal"><div class="modal-head"><h2>刮削历史文件</h2><button class="mini" onclick="historyDialog.close()">关闭</button></div><div class="history-search"><input id="historyQuery" class="field" placeholder="搜索 NAS 中的视频文件"><button class="button" onclick="loadHistory()">搜索</button></div><div id="historyList" class="history-list"></div><div class="modal-actions"><button class="button primary" onclick="createHistoryTask()">加入刮削队列</button></div></div></dialog>
<dialog id="previewDialog"><div class="modal"><div class="modal-head"><h2>刮削结果</h2><button class="mini" onclick="previewDialog.close()">关闭</button></div><div class="preview-grid"><img id="previewCover" class="preview-cover"><div id="previewData" class="preview-data"></div></div></div></dialog>

<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt){const r=await fetch(path,opt),type=r.headers.get('content-type')||'',data=type.includes('json')?await r.json():{};if(!r.ok)throw Error(data.error||'请求失败');return data}
let allTasks=[],filter='all',selectedHistory='',sources=[],catalogItems=[],extractTimer,latestBrowserMetadata=0;
const stateNames={pending:'等待中',running:'执行中',completed:'已完成',skipped:'已跳过',failed:'失败',cancelled:'已取消',interrupted:'已中断'};
const stepNames={pending:'等待',running:'进行中',succeeded:'成功',failed:'失败',skipped:'跳过'};
const finalStates=['completed','skipped','failed','cancelled','interrupted'];

async function loadSettings(){try{const s=await api('/api/settings');threads.value=s.threads;organizeEnabled.checked=s.organize_enabled;allowDuplicate.checked=s.allow_duplicate;proxy.value=s.proxy||'';failureEnabled.checked=s.failure_route_enabled;failurePath.value=s.failure_path||'/media/待整理'}catch(e){}}
async function saveSettings(silent=false){try{await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({threads:+threads.value,organize_enabled:organizeEnabled.checked,allow_duplicate:allowDuplicate.checked,proxy:proxy.value,failure_route_enabled:failureEnabled.checked,failure_path:failurePath.value})});if(!silent)syncNote.textContent='设置已保存。'}catch(e){alert(e.message)}}

async function extractDetails(){const value=pageUrl.value.trim();if(!value)return;extractButton.disabled=true;extractButton.textContent='获取中…';try{const data=await api('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page_url:value})});if(data.title)title.value=data.title;if(data.catalog)catalog.value=data.catalog;const complete=data.title&&data.title!==data.catalog;syncNote.textContent=complete?'已获取完整标题和番号。':'已识别番号；打开影片详情可由浏览器助手补充完整标题和 M3U8。'}catch(e){syncNote.textContent=e.message}finally{extractButton.disabled=false;extractButton.textContent='获取影片信息'}}
extractButton.onclick=extractDetails;pageUrl.addEventListener('input',()=>{clearTimeout(extractTimer);if(/^https?:\/\//i.test(pageUrl.value.trim()))extractTimer=setTimeout(extractDetails,700)});
async function receiveBrowserMetadata(){try{const data=await api('/api/latest-browser-metadata'),stamp=Number(data.updated_at||0);if(!stamp||stamp<=latestBrowserMetadata)return;latestBrowserMetadata=stamp;if(Date.now()/1000-stamp>30)return;if(data.page_url)pageUrl.value=data.page_url;if(data.title)title.value=data.title;if(data.catalog)catalog.value=data.catalog;if(data.media_url)url.value=data.media_url;syncNote.textContent=data.media_url?'浏览器助手已同步标题、番号和 M3U8。':'浏览器助手已同步标题和番号，播放影片后会继续捕获 M3U8。'}catch(e){}}

form.onsubmit=async e=>{e.preventDefault();try{await saveSettings(true);await api('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url.value,title:title.value,catalog:catalog.value,performer:performer.value,extra_args:extraArgs.value,threads:+threads.value,organize_enabled:organizeEnabled.checked,allow_duplicate:allowDuplicate.checked})});url.value='';title.value='';catalog.value='';performer.value='';extraArgs.value='';await refresh()}catch(e){alert(e.message)}};
function badge(label,value){return `<span class="step ${esc(value)}">${label} ${esc(stepNames[value]||value)}</span>`}
function taskHtml(t){const failed=['failed','cancelled','interrupted'].includes(t.state),running=t.state==='running',finished=finalStates.includes(t.state),scrapeFailed=t.scrape_step==='failed'&&t.output_path,cover=t.cover_url?`<img class="cover" src="${esc(t.cover_url)}">`:'<div class="cover cover-placeholder">暂无封面</div>';return `<article class="task" id="t-${t.id}">${cover}<div class="task-main"><div class="task-head"><span class="state ${failed?'failed':running?'running':''}">${esc(stateNames[t.state]||t.phase)}</span><span class="task-title">${esc(t.catalog||t.title)}</span><span class="percent">${Math.round(t.progress*100)}%</span></div><progress max="1" value="${t.progress}"></progress><div class="steps">${badge('1 下载',t.download_step)}${badge('2 刮削',t.scrape_step)}${badge('3 整理',t.organize_step)}</div><div class="meta"><span>速度 ${esc(t.speed||'-')}</span><span>大小 ${esc(t.size||'-')}</span><span>剩余 ${esc(t.eta||'-')}</span><span>线程 ${t.threads}</span><span>${esc(t.performer||'演员待获取')}</span></div>${t.result_message?`<div class="result">${esc(t.result_message)}</div>`:''}<div class="actions"><button class="mini" onclick="toggleLog('${t.id}')">日志</button>${t.state==='pending'?`<button class="mini" onclick="taskAction('${t.id}','priority')">优先</button><button class="mini danger" onclick="taskAction('${t.id}','cancel')">取消</button>`:''}${running?`<button class="mini danger" onclick="taskAction('${t.id}','cancel')">停止</button>`:''}${failed?`<button class="mini" onclick="taskAction('${t.id}','retry')">重试</button>`:''}${scrapeFailed?`<button class="mini" onclick="retryScrape('${t.id}')">重试刮削</button><button class="mini" onclick="retryScrape('${t.id}',true)">换源重试</button>`:''}${t.output_path?`<button class="mini" onclick="previewTask('${t.id}')">刮削预览</button>`:''}${finished?`<button class="mini danger" onclick="deleteTask('${t.id}')">删除记录</button>`:''}</div></div><pre class="log">${esc(t.log)}</pre></article>`}
function matches(t){if(filter==='all')return true;if(filter==='waiting')return t.state==='pending';if(filter==='running')return t.state==='running';if(filter==='completed')return ['completed','skipped'].includes(t.state);if(filter==='failed')return ['failed','cancelled','interrupted'].includes(t.state);if(filter==='scrape')return t.scrape_step==='failed';return true}
function render(){const visible=allTasks.filter(matches);tasks.innerHTML=visible.length?visible.map(taskHtml).join(''):'<div class="empty">当前筛选没有任务</div>';const count=k=>allTasks.filter(k).length,total=allTasks.filter(t=>t.state==='completed').reduce((n,t)=>n+(t.total_bytes||t.downloaded_bytes||0),0);stats.innerHTML=`<span>等待 <strong>${count(t=>t.state==='pending')}</strong></span><span>执行 <strong>${count(t=>t.state==='running')}</strong></span><span>完成 <strong>${count(t=>['completed','skipped'].includes(t.state))}</strong></span><span>失败 <strong>${count(t=>['failed','cancelled','interrupted'].includes(t.state))}</strong></span><span>刮削失败 <strong>${count(t=>t.scrape_step==='failed')}</strong></span><span>成片 <strong>${formatBytes(total)}</strong></span>`;const items=[['all','全部'],['waiting','等待'],['running','执行中'],['completed','完成'],['failed','失败'],['scrape','刮削失败']];filters.innerHTML=items.map(([k,v])=>`<button class="filter ${filter===k?'active':''}" onclick="setFilter('${k}')">${v}</button>`).join('')}
function formatBytes(n){let v=+n||0,u='B';for(const x of ['B','KB','MB','GB','TB']){u=x;if(v<1024||x==='TB')break;v/=1024}return v.toFixed(1)+' '+u}function setFilter(v){filter=v;render()}function toggleLog(id){$('t-'+id).classList.toggle('open')}
async function refresh(){try{allTasks=await api('/api/tasks');render();health.textContent='服务正常'}catch(e){health.textContent='连接失败'}}
async function taskAction(id,action){try{await api(`/api/tasks/${id}/${action}`,{method:'POST'});refresh()}catch(e){alert(e.message)}}async function deleteTask(id){if(!confirm('仅删除任务记录，不删除成片。确定继续？'))return;await api(`/api/tasks/${id}`,{method:'DELETE'});refresh()}
async function retryScrape(id,choose=false){let source='';if(choose){source=prompt('输入优先使用的刮削源域名，留空则按管理列表顺序尝试：','')||''}try{await api(`/api/tasks/${id}/retry-scrape`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source})});refresh()}catch(e){alert(e.message)}}
async function previewTask(id){try{const data=await api(`/api/tasks/${id}/preview`),m=data.metadata||{},t=data.task;previewCover.src=t.cover_url||'';previewData.innerHTML=`<label>标题<div>${esc(m.title||t.title||'-')}</div></label><label>番号<div>${esc(m.avid||t.catalog||'-')}</div></label><label>演员<div>${esc(Object.keys(m.actress||{}).join('、')||t.performer||'未知演员')}</div></label><label>发行日期<div>${esc(m.release_date||'-')}</div></label><label>标签<div>${esc((m.keywords||[]).join('、')||'-')}</div></label><label>简介<div class="description">${esc(m.description||'-')}</div></label><label>结果路径<div>${esc(t.output_path||'-')}</div></label>`;previewDialog.showModal()}catch(e){alert(e.message)}}

async function openCatalog(){catalogDialog.showModal();if(!catalogItems.length)await loadCatalog(false)}
async function loadCatalog(force){catalogGrid.innerHTML='<div class="catalog-status">容器浏览器正在加载 Jable 列表…</div>';try{catalogItems=await api('/api/jable/catalog'+(force?'?refresh=1':''));renderCatalog();catalogNote.textContent=`已加载 ${catalogItems.length} 部影片，点击即可自动入队`}catch(e){catalogGrid.innerHTML=`<div class="catalog-status">${esc(e.message)}<br><br>可在“下载与失败路径设置”中配置代理后重试。</div>`}}
function renderCatalog(){catalogGrid.innerHTML=catalogItems.map((item,i)=>`<article class="catalog-card"><img src="${esc(item.image_url)}" loading="lazy"><div class="catalog-info"><a class="catalog-title" href="${esc(item.detail_url)}" target="_blank">${esc(item.title||item.catalog)}</a><div class="catalog-meta"><span>${esc(item.catalog||'番号待识别')}</span><span>${esc(item.duration||'')}</span></div><button id="auto-${i}" class="mini" onclick="autoCatalogTask(${i})">自动获取并加入</button></div></article>`).join('')||'<div class="catalog-status">没有读取到影片，请刷新重试。</div>'}
async function autoCatalogTask(i){const item=catalogItems[i],button=$('auto-'+i);button.disabled=true;button.textContent='正在打开详情并捕获…';catalogNote.textContent=`正在处理 ${item.catalog||item.title}，通常需要 5–30 秒`;try{const data=await api('/api/jable/auto-task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({detail_url:item.detail_url,threads:+threads.value,organize_enabled:organizeEnabled.checked,allow_duplicate:allowDuplicate.checked})});button.textContent='已加入队列';catalogNote.textContent=`${data.catalog||data.title} 已自动加入队列`;refresh()}catch(e){button.disabled=false;button.textContent='重试自动获取';catalogNote.textContent=e.message}}

async function openHistory(){historyDialog.showModal();await loadHistory()}async function loadHistory(){try{const list=await api('/api/media-files?q='+encodeURIComponent(historyQuery.value));historyList.innerHTML=list.length?list.map(f=>`<button class="history-item ${selectedHistory===f.path?'selected':''}" onclick="selectHistory('${encodeURIComponent(f.path)}')"><span>${esc(f.name)}</span><span>${formatBytes(f.size)}</span></button>`).join(''):'<div class="empty">没有找到视频文件</div>'}catch(e){historyList.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}function selectHistory(value){selectedHistory=decodeURIComponent(value);loadHistory()}async function createHistoryTask(){if(!selectedHistory)return alert('请先选择视频文件');try{await api('/api/history-tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:selectedHistory,title:title.value,catalog:catalog.value,performer:performer.value})});historyDialog.close();selectedHistory='';refresh()}catch(e){alert(e.message)}}

async function openSources(){try{sources=await api('/api/scraper-sources');renderSources();sourceDialog.showModal()}catch(e){alert(e.message)}}function renderSources(){sourceList.innerHTML=sources.map((s,i)=>`<div class="source-row"><input type="checkbox" ${s.enabled?'checked':''} onchange="sources[${i}].enabled=this.checked"><input type="text" value="${esc(s.domain)}" onchange="sources[${i}].domain=this.value;sources[${i}].health='unchecked'"><span class="health-tag">${s.health==='available'?'可用':s.health==='unavailable'?'不可用':'未检测'}</span><button class="mini" onclick="checkSource(${i})">测</button><button class="mini" onclick="moveSource(${i},-1)">↑</button><button class="mini danger" onclick="removeSource(${i})">×</button></div>`).join('')}function addSource(){sources.push({domain:'',enabled:true,health:'unchecked'});renderSources()}function moveSource(i,d){const n=i+d;if(n<0||n>=sources.length)return;[sources[i],sources[n]]=[sources[n],sources[i]];renderSources()}function removeSource(i){sources.splice(i,1);renderSources()}async function checkSource(i){try{sources[i].health='checking';renderSources();const r=await api('/api/scraper-sources/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain:sources[i].domain})});sources[i].health=r.health;renderSources()}catch(e){sources[i].health='unavailable';renderSources()}}async function checkAllSources(){for(let i=0;i<sources.length;i++)await checkSource(i)}async function saveSources(){try{sources=await api('/api/scraper-sources',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({sources})});sourceDialog.close()}catch(e){alert(e.message)}}

loadSettings();refresh();receiveBrowserMetadata();setInterval(refresh,1500);setInterval(receiveBrowserMetadata,1500);
</script></body></html>
