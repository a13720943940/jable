name: jable-license-server

services:
  license-server:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: jable-license-server:20260908-admin-api
    container_name: jable-license-server
    restart: unless-stopped
    ports:
      - "8789:8789"
    environment:
      # 授权管理台访问密码（登录用），可自行修改
      LICENSE_SERVER_PASSWORD: 13720943940@1q
      LICENSE_DATA_DIR: /data
    volumes:
      # 私钥 nassav_private_key.hex 与吊销名单 revocation.json 放在此目录
      - /volume2/docker/jable-license-server/license-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8789/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
